<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <main class="auth">
        <section class="auth__visual">
            <img class="auth__image" src="assets/images/auth-image.svg" alt="Shopping illustration">
        </section>

        <section class="auth__content">
            <div class="auth-form">
                <h1 class="auth-form__title">Log in to Exclusive</h1>
                <p class="auth-form__subtitle">Enter your details below</p>

                <form class="form" action="#">
                    <label class="form__field">
                        <span class="form__label sr-only">Email or Phone Number</span>
                        <input class="form__input" type="text" placeholder="Email or Phone Number"
                            autocomplete="username">
                    </label>

                    <label class="form__field">
                        <span class="form__label sr-only">Password</span>
                        <input class="form__input" type="password" placeholder="Password" autocomplete="new-password">
                    </label>

                    <button class="btn btn--primary btn--login" type="submit">Log In</button>
                    <a class="form__forgot" href="#">Forgot Password?</a>
                </form>


            </div>
        </section>
    </main>
</body>

</html>
